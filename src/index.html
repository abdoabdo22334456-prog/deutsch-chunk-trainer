<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file: 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' file: blob:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; media-src 'self' file: blob:;"
    />
    <title>دفتر الشانكس</title>
    <link rel="icon" href="../assets/icon.png" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/screens.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-gear" viewBox="0 0 24 24">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
        <path d="M19.4 13.5a7.9 7.9 0 0 0 0-3l1.8-1.2-1.7-3-2.1.8a7.8 7.8 0 0 0-2.6-1.5L14.5 3h-3.6l-.4 2.2a7.8 7.8 0 0 0-2.6 1.5l-2.1-.8-1.7 3 1.8 1.2a7.9 7.9 0 0 0 0 3l-1.8 1.2 1.7 3 2.1-.8a7.8 7.8 0 0 0 2.6 1.5l.4 2.2h3.6l.3-2.2a7.8 7.8 0 0 0 2.6-1.5l2.1.8 1.7-3-1.7-1.2Z" />
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="M9 5l7 7-7 7" />
      </symbol>
      <symbol id="i-forward" viewBox="0 0 24 24">
        <path d="M15 5l-7 7 7 7" />
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8 5.5v13l10-6.5-10-6.5Z" />
      </symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24">
        <path d="M4 10v4h3l4 3.5v-15L7 6H4Z" />
        <path d="M15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" />
      </symbol>
      <symbol id="i-speaker-off" viewBox="0 0 24 24">
        <path d="M4 10v4h3l4 3.5v-15L7 6H4Z" />
        <path d="M16 9l6 6M22 9l-6 6" />
      </symbol>
      <symbol id="i-mic" viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="11" rx="3" />
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10.5" width="14" height="10" rx="2.5" />
        <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" />
      </symbol>
      <symbol id="i-flame" viewBox="0 0 24 24">
        <path d="M12 3s5 4.5 5 9a5 5 0 0 1-10 0c0-1.6.6-3 1.5-4.2.3 1.4 1 2.2 2 2.7C11 8.6 11.6 5.8 12 3Z" />
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <rect x="3.5" y="5.5" width="17" height="15" rx="2.5" />
        <path d="M3.5 10h17M8 3.5v4M16 3.5v4" />
      </symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24">
        <path d="M8 4h8v4a4 4 0 0 1-8 0V4Z" />
        <path d="M8 5H5.5v1.5A3.5 3.5 0 0 0 9 10M16 5h2.5v1.5A3.5 3.5 0 0 1 15 10M12 12v5M8.5 20h7M10 20l.5-3.5h3l.5 3.5" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="M15.5 15.5L20 20" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6L6 18" />
      </symbol>
      <symbol id="i-folder" viewBox="0 0 24 24">
        <path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2.5h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-9.5Z" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v10M8 10.5l4 4 4-4M4.5 19.5h15" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 15V5M8 8.5l4-4 4 4M4.5 19.5h15" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M5 7h14M9.5 7V5h5v2M7 7l.8 12h8.4L17 7M10 10.5v5M14 10.5v5" />
      </symbol>
      <symbol id="i-spark" viewBox="0 0 24 24">
        <path d="M12 3.5l2.2 5.3 5.3 2.2-5.3 2.2L12 18.5l-2.2-5.3L4.5 11l5.3-2.2L12 3.5Z" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 7.5V12l3.2 2" />
      </symbol>
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </symbol>
      <symbol id="i-target" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <circle cx="12" cy="12" r="4.5" />
        <circle cx="12" cy="12" r="1" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path d="M4 4l16 16" />
        <path d="M9.9 5.9A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.4 3.3M6.4 7.6A17 17 0 0 0 2.5 12S6 18.5 12 18.5a9.7 9.7 0 0 0 3.5-.65" />
      </symbol>
      <symbol id="i-chill" viewBox="0 0 24 24">
        <path d="M17 8h1a4 4 0 1 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8Z" />
        <path d="M6 2v2M10 2v2M14 2v2" />
      </symbol>
      <symbol id="i-library" viewBox="0 0 24 24">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5V5.5Z" />
        <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20" />
        <path d="M8.5 7.5h7M8.5 11h5" />
      </symbol>
    </svg>

    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#/home">
          <span class="brand-mark">Ch</span>
          <span class="brand-text">
            <strong>دفتر الشانكس</strong>
            <span>ألماني من A1 لـ C1</span>
          </span>
        </a>

        <nav class="nav" id="nav" aria-label="أقسام التطبيق">
          <a href="#/home" data-nav="home">الرئيسية</a>
          <a href="#/library" data-nav="library">المكتبة المصورة</a>
          <a href="#/review" data-nav="review">المراجعة <b id="nav-due" class="nav-badge" hidden></b></a>
          <a href="#/stats" data-nav="stats">التقدم</a>
          <a href="#/trophies" data-nav="trophies">الإنجازات</a>
          <a href="#/method" data-nav="method">الطريقة</a>
          <a href="#/chill" data-nav="chill">تشيل مود <svg class="i nav-icon-chill" style="margin-inline-start:4px"><use href="#i-chill" /></svg></a>
        </nav>

        <div class="topbar-side">
          <div class="lang-switcher" role="group" aria-label="Language / اللغة / Sprache">
            <button type="button" class="lang-btn is-active" data-lang-switch="ar" title="العربية">AR</button>
            <button type="button" class="lang-btn" data-lang-switch="en" title="English">EN</button>
            <button type="button" class="lang-btn" data-lang-switch="de" title="Deutsch">DE</button>
          </div>
          <div class="streak-pill" id="streak-pill" title="سلسلة الأيام المتواصلة"></div>
          <button class="icon-btn" id="sound-btn" aria-label="الصوت" title="كتم / تشغيل الصوت">
            <svg class="i" id="sound-btn-icon"><use href="#i-speaker" /></svg>
          </button>
          <button class="icon-btn" id="settings-btn" aria-label="الإعدادات" title="الإعدادات">
            <svg class="i"><use href="#i-gear" /></svg>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script src="./js/vendor/tone.js"></script>
    <script src="./js/vendor/snd.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
